[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adcut-logo-vectorizer"
version = "0.1.0"
description = "Adcut image-to-CAD development foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40,<2",
    "Pillow>=10,<13",
    "ezdxf>=1.4,<2",
    "pypdfium2>=4,<6",
    "svgelements>=1.9.6,<2",
    "vtracer==1.0.0a4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
